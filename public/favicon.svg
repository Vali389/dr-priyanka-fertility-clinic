<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a152d"/>
      <stop offset="50%" stop-color="#7a1c43"/>
      <stop offset="100%" stop-color="#b83260"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e06287"/>
      <stop offset="100%" stop-color="#f8b4c4"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7a1c43" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#wineGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#roseGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Stylized Motherhood & Fertility Heart / Blooming Motif -->
  <g filter="url(#softGlow)">
    <!-- Elegant heart silhouette -->
    <path d="M32 52.5C32 52.5 14 41 14 26.5C14 18.5 20.5 13 27 13C30.2 13 32 15.2 32 15.2C32 15.2 33.8 13 37 13C43.5 13 50 18.5 50 26.5C50 41 32 52.5 32 52.5Z" 
          fill="url(#roseGrad)" 
          opacity="0.95"/>

    <!-- Inner gentle caring baby / mother profile swirl -->
    <path d="M32 20C34.5 17.5 37.5 16.5 40 17.5C43.5 18.9 45 22.5 44 26C42.8 30.2 38 36 32 42C26 36 21.2 30.2 20 26C19 22.5 20.5 18.9 24 17.5C26.5 16.5 29.5 17.5 32 20Z" 
          fill="#ffffff" 
          opacity="0.9"/>
          
    <!-- Central warmth spark / sprout -->
    <circle cx="32" cy="28" r="3.5" fill="#7a1c43"/>
    <path d="M32 23C32 23 33.5 25.5 33.5 28C33.5 29 32.8 29.8 32 29.8C31.2 29.8 30.5 29 30.5 28C30.5 25.5 32 23 32 23Z" fill="#b83260"/>
    
    <!-- Medical care cross accent in corner -->
    <path d="M47 13V19M44 16H50" stroke="#fce7ee" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
