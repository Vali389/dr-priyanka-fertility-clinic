<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf2f4"/>
      <stop offset="50%" stop-color="#f7e1e7"/>
      <stop offset="100%" stop-color="#edd0d8"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f3f6"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6c8a8"/>
      <stop offset="100%" stop-color="#e3a782"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1a1f"/>
      <stop offset="100%" stop-color="#190e12"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#641634"/>
      <stop offset="100%" stop-color="#8e214d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#641634" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative ambient circles -->
  <circle cx="80" cy="120" r="100" fill="#f8b4c4" opacity="0.25" filter="blur(30px)"/>
  <circle cx="320" cy="380" r="120" fill="#b83260" opacity="0.15" filter="blur(40px)"/>

  <!-- Character Group with Soft Shadow -->
  <g filter="url(#shadow)">
    <!-- Shoulders & Torso / Medical Coat -->
    <path d="M70 500 C70 410 110 330 200 330 C290 330 330 410 330 500 Z" fill="url(#coatGrad)"/>
    
    <!-- Inner Blouse / Top in Wine -->
    <path d="M165 330 L200 420 L235 330 Z" fill="url(#wineGrad)"/>

    <!-- Doctor Coat Lapels -->
    <path d="M130 340 L175 450 L195 450 L160 330 Z" fill="#e2e8f0"/>
    <path d="M270 340 L225 450 L205 450 L240 330 Z" fill="#e2e8f0"/>
    
    <!-- Stethoscope -->
    <path d="M160 360 C160 440 185 455 195 455 C205 455 230 440 230 360" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="195" cy="460" r="10" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="195" cy="460" r="5" fill="#64748b"/>

    <!-- Neck -->
    <rect x="175" y="240" width="50" height="70" rx="10" fill="url(#skinGrad)"/>
    <path d="M175 285 C185 295 215 295 225 285 L225 310 L175 310 Z" fill="#d99772" opacity="0.4"/>

    <!-- Hair Back -->
    <path d="M115 190 C115 100 150 70 200 70 C250 70 285 100 285 190 C285 280 270 310 260 320 C240 300 240 240 240 240 L160 240 C160 240 160 300 140 320 C130 310 115 280 115 190 Z" fill="url(#hairGrad)"/>

    <!-- Head / Face -->
    <path d="M140 190 C140 260 165 290 200 290 C235 290 260 260 260 190 C260 125 235 110 200 110 C165 110 140 125 140 190 Z" fill="url(#skinGrad)"/>

    <!-- Hair Front / Style -->
    <path d="M135 180 C135 130 160 90 200 90 C235 90 265 120 265 170 C255 140 230 130 200 135 C170 140 148 160 135 180 Z" fill="url(#hairGrad)"/>
    <path d="M140 170 C145 130 175 115 200 115 C180 130 160 155 150 185 Z" fill="#3a222a"/>

    <!-- Eyebrows -->
    <path d="M165 175 C172 170 182 171 188 175" stroke="#2c1a1f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M212 175 C218 171 228 170 235 175" stroke="#2c1a1f" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <ellipse cx="177" cy="188" rx="5.5" ry="4" fill="#2c1a1f"/>
    <circle cx="178.5" cy="186.5" r="1.5" fill="#ffffff"/>
    <ellipse cx="223" cy="188" rx="5.5" ry="4" fill="#2c1a1f"/>
    <circle cx="224.5" cy="186.5" r="1.5" fill="#ffffff"/>
    
    <!-- Gentle Eye Eyelashes/Creases -->
    <path d="M170 185 C174 182 181 182 185 185" stroke="#190e12" stroke-width="1.5" fill="none"/>
    <path d="M215 185 C219 182 226 182 230 185" stroke="#190e12" stroke-width="1.5" fill="none"/>

    <!-- Nose -->
    <path d="M200 185 L198 210 C198 213 202 214 204 212" stroke="#cc8762" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Warm Smile -->
    <path d="M182 235 C190 246 210 246 218 235" stroke="#992349" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M185 236 C192 242 208 242 215 236" fill="#ffffff"/>

    <!-- Cheeks Blush -->
    <ellipse cx="163" cy="212" rx="9" ry="5" fill="#f87171" opacity="0.25"/>
    <ellipse cx="237" cy="212" rx="9" ry="5" fill="#f87171" opacity="0.25"/>

    <!-- Doctor Name Badge -->
    <rect x="235" y="380" width="55" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="240" y="386" width="30" height="4" rx="2" fill="#7a1c43"/>
    <rect x="240" y="393" width="45" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Professional Badge Overlay on bottom -->
  <g transform="translate(40, 435)">
    <rect width="320" height="46" rx="23" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="24" cy="23" r="14" fill="#7a1c43"/>
    <path d="M24 16V30M17 23H31" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="22" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#4a152d">Dr. Priyanka Singh</text>
    <text x="48" y="35" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748b">MBBS, DGO, DNB (OBG) · IVF Specialist</text>
  </g>
</svg>
